<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI Macro Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --card-bg: #141b24;
      --accent: #00e676;
      --accent-sub: #00b0ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --danger: #ff5252;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1, h2, h3 { margin: 0; font-weight: 700; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-top: 8px; }
    .header h1 { font-size: 1.25rem; color: var(--accent); letter-spacing: 0.05em; }
    .header .date { font-size: 0.85rem; color: var(--text-muted); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 0.95rem; color: var(--accent-sub); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .stat-sub { font-size: 0.7rem; color: var(--text-muted); }

    .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-toggle {
      flex: 1;
      background: #1c2430;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-toggle.active {
      background: rgba(0, 230, 118, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .progress-bar-bg { background: #21262d; border-radius: 6px; height: 10px; overflow: hidden; margin: 8px 0; }
    .progress-bar { background: linear-gradient(90deg, var(--accent-sub), var(--accent)); height: 100%; width: 0%; transition: width 0.3s; }
    .pfc-bars { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 6px; }

    .presets-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .btn-chip {
      background: #1e2633;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .form-group { margin-bottom: 12px; position: relative; }
    label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { border-color: var(--accent); outline: none; }
